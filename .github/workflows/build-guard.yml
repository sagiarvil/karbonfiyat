name: Build Guard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  astro-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Firebase Functions dependencies
        working-directory: functions
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Check Firebase function syntax
        working-directory: functions
        run: npm run lint

      - name: Test Firebase market adapters
        working-directory: functions
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify critical routes
        run: |
          test -f dist/index.html
          test -f dist/karbon-fiyati/index.html
          test -f dist/fiyatlandirma/index.html
          test -f dist/workspace/index.html
          test -f dist/carbon-monitor/index.html
          test -f dist/musteri-karliligi/index.html
          test -f dist/hakkimizda/index.html
          test -f dist/iletisim/index.html
          test -f dist/gizlilik/index.html
          test -f dist/llms.txt
          test -f dist/llms-full.txt
          test -f dist/index.md
          test -f dist/sitemap.xml
          echo "Critical routes and SEO surfaces verified."
