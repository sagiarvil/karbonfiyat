<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0C0F" />
    <title>Çevrimdışı — KarbonFiyat</title>
    <style>
      body {
        margin: 0;
        padding: 40px 24px;
        background: #0A0C0F;
        color: #E8EAED;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        box-sizing: border-box;
        text-align: center;
      }
      .logo {
        width: 64px;
        height: 64px;
        margin-bottom: 24px;
      }
      h1 {
        font-size: 24px;
        margin: 0 0 12px;
        font-weight: 700;
      }
      p {
        color: #9AA1AC;
        font-size: 15px;
        line-height: 1.5;
        max-width: 380px;
        margin: 0 0 24px;
      }
      .btn {
        display: inline-block;
        background: #2563EB;
        color: #FFFFFF;
        text-decoration: none;
        padding: 12px 24px;
        border-radius: 8px;
        font-weight: 600;
        font-size: 14px;
        min-height: 48px;
        line-height: 24px;
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <img src="/logo/karbonfiyat-logo.png" alt="KarbonFiyat Logo" class="logo" />
    <h1>Şu Anda Çevrimdışısınız</h1>
    <p>İnternet bağlantınızı kontrol edin. Daha önce ziyaret ettiğiniz piyasa verileri ve sayfalar önbellekten yüklenebilir.</p>
    <a href="/" class="btn" onclick="window.location.reload(); return false;">Tekrar Dene</a>
  </body>
</html>
