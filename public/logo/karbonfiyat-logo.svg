<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Premium Luminous Contrast Filter for Dark Background -->
    <filter id="contrastGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#3B82F6" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="luminousWhite" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0EDFF"/>
    </linearGradient>
  </defs>

  <!-- Arrow Shaft (Thick diagonal line at 45 deg) -->
  <line
    x1="128"
    y1="384"
    x2="436"
    y2="76"
    stroke="url(#luminousWhite)"
    stroke-width="32"
    stroke-linecap="square"
    filter="url(#contrastGlow)"
  />

  <!-- Arrowhead (Hollow triangular head pointing northeast) -->
  <!-- Outer perimeter path -->
  <path
    d="M 405 154 L 494 24 L 364 113 L 396 145 Z"
    display="none"
  />
  <path
    d="M 494 24 L 390 44 L 452 106 Z"
    display="none"
  />
  <!-- Geometric Hollow Arrowhead matching reference precisely -->
  <!-- Outer boundary: Tip (488, 24), Wing1 (412, 172), Wing2 (340, 100) with barb notch at (396, 116) -->
  <path
    d="M 488 24 L 416 168 L 394 122 L 344 100 Z"
    display="none"
  />
  <!-- Canonical clean outline representation of the exact user arrow: -->
  <!-- Outer polygon: Tip at (484, 28), Right Barb (456, 156), Notch (416, 116), Left Barb (356, 56) -->
  <polygon
    points="488,24 452,154 414,116 358,60"
    fill="none"
    stroke="url(#luminousWhite)"
    stroke-width="32"
    stroke-linejoin="miter"
    stroke-miterlimit="4"
    filter="url(#contrastGlow)"
  />

  <!-- Tail Feathers / Fletching (Hollow chevron fletching at bottom-left) -->
  <!-- Outer chevron: Tip notch at (144, 368), Outer tips at (72, 440) and (24, 392) -->
  <polygon
    points="148,364 140,432 84,376"
    display="none"
  />
  <path
    d="M 148 364 L 140 448 L 76 440 L 16 380 L 80 372 Z"
    display="none"
  />
  <polygon
    points="152,360 144,452 74,440 18,384 86,376"
    display="none"
  />
  <!-- Pure geometric chevron outline fletching matching user reference: -->
  <polygon
    points="156,356 142,448 68,374 14,392 78,318 112,352"
    display="none"
  />
  <!-- Exact contour from uploaded image: -->
  <!-- Left wing: (24, 390) to (88, 326) to (148, 386) to (84, 450) -->
  <polygon
    points="96,336 28,388 92,452 144,400"
    fill="none"
    stroke="url(#luminousWhite)"
    stroke-width="32"
    stroke-linejoin="miter"
    stroke-miterlimit="4"
    filter="url(#contrastGlow)"
  />
</svg>
