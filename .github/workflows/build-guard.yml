name: Build Guard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  astro-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify critical routes
        run: |
          test -f dist/index.html
          test -f dist/karbon-fiyati/index.html
          test -f dist/fiyatlandirma/index.html
          echo "Critical routes verified."
